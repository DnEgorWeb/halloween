<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Listen Carefully</title>
  <meta name="theme-color" content="#f7f2f1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@500;700&display=swap">
  <link rel="preload" href="images/background.jpg" as="image">
  <style>
    :root {
      --ink: #1c1a19;
      --paper: #f7f2f1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    html {
      overflow-x: hidden;
      overflow-x: clip;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      background: var(--paper) url("images/paper.jpg") repeat;
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }

    /* The illustration keeps its proportions and fits the screen height;
       the paper tile behind it fills whatever space is left. On phones it
       runs 10% wider than the screen, trimming only blank paper margin. */
    .poster {
      position: relative;
      left: 50%;
      translate: -50% 0;
      justify-self: start;
      width: min(110vw, max(100vh * 728 / 1022, 360px));
      width: min(110vw, max(100svh * 728 / 1022, 360px));
      aspect-ratio: 728 / 1022;
      background: url("images/background.jpg") center / cover no-repeat;
      container-type: inline-size;
    }

    /* Sits in the blank space between the illustrations. */
    .message {
      position: absolute;
      inset: 33% 23.5% 14%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      text-align: center;
      font-size: clamp(15px, 3.8cqw, 27px);
      line-height: 1.2;
      text-wrap: balance;
    }

    .message p {
      margin: 0;
    }

    .play {
      margin-top: 0.9em;
      padding: 0.55em 2.1em 0.5em;
      border: 2px solid var(--ink);
      /* Uneven corners echo the hand-drawn illustrations. */
      border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
      background: var(--ink);
      color: var(--paper);
      font-family: "Cinzel", Georgia, serif;
      font-size: 0.85em;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .play:hover {
      background: transparent;
      color: var(--ink);
    }

    .play:active {
      transform: translateY(1px);
    }

    .play:focus-visible {
      outline: 2px dashed var(--ink);
      outline-offset: 4px;
    }

    .play.is-playing {
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 0.45em rgb(28 26 25 / 0.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .play.is-playing {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="message">
      <p><strong>You’re getting closer.</strong></p>
      <p>The next part of the story is not where you expect it to be.</p>
      <p><strong>Listen carefully.</strong></p>
      <p>Follow the sound.</p>
      <p>Find the person who makes it every day.</p>
      <p><strong>They have something for you.</strong></p>
      <button type="button" class="play" id="play">Play</button>
    </div>
  </main>

  <audio id="sound" src="audio/espresso.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('sound');
    const button = document.getElementById('play');
    const soundUrl = audio.src;

    // Download the whole file as soon as the page opens, so a tap on Play
    // starts the sound instantly instead of waiting on the network.
    fetch(soundUrl)
      .then((res) => (res.ok ? res.blob() : Promise.reject(new Error(res.statusText))))
      .then((blob) => {
        if (audio.paused) {
          audio.src = URL.createObjectURL(blob);
          audio.load();
        }
      })
      .catch(() => {
        // The <audio preload="auto"> element still buffers the file itself.
      });

    button.addEventListener('click', () => {
      audio.currentTime = 0;
      audio.play().catch(() => {
        // Some browsers refuse blob URLs for media; retry with the file itself.
        audio.src = soundUrl;
        audio.play().catch(() => {});
      });
    });

    audio.addEventListener('playing', () => button.classList.add('is-playing'));
    audio.addEventListener('pause', () => button.classList.remove('is-playing'));
    audio.addEventListener('ended', () => button.classList.remove('is-playing'));
  </script>
</body>
</html>
